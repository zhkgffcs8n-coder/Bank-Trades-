name: Paper research safety checks
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: paper-safety-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
