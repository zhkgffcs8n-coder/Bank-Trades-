name: BANK TRADES tests and build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Full regression suite (capture TAP results)
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-evidence
          npm test 2>&1 | tee ci-evidence/npm-test.log
      - name: Verify public assets and protected dashboard
        run: |
          test -s dist/index.html
          test -s dist/premium.js
          test -s dist/arcade-crew.js
          test -s dist/arcade-theme.css
          test -s dist/account-client.js
          test ! -e dist/dashboard.html
          test ! -e dist/private
      - name: Summarize failed tests in GitHub job summary
        if: always()
        shell: bash
        run: |
          if [ -f ci-evidence/npm-test.log ]; then
            echo '### BANK TRADES regression summary' >> "$GITHUB_STEP_SUMMARY"
            grep -E '^# (tests|pass|fail|cancelled|skipped) ' ci-evidence/npm-test.log | tail -n 6 >> "$GITHUB_STEP_SUMMARY" || true
            if grep -q '^not ok ' ci-evidence/npm-test.log; then
              echo '### Failed test names' >> "$GITHUB_STEP_SUMMARY"
              grep '^not ok ' ci-evidence/npm-test.log >> "$GITHUB_STEP_SUMMARY" || true
              grep -A 18 '^not ok ' ci-evidence/npm-test.log > ci-evidence/failed-tests.txt || true
            fi
          fi
      - name: Record build and regression evidence
        if: always()
        shell: bash
        run: |
          mkdir -p ci-evidence
          printf 'commit=%s\nrun_id=%s\nrun_attempt=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > ci-evidence/run-info.txt
          if [ -s dist/build-version.json ]; then cp dist/build-version.json ci-evidence/build-version.json; fi
      - name: Upload CI evidence (including failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bank-trades-ci-evidence
          path: ci-evidence/
          retention-days: 14
