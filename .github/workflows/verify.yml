name: BANK TRADES tests and build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Verify public assets and protected dashboard
        run: |
          test -s dist/index.html
          test -s dist/premium.js
          test -s dist/arcade-crew.js
          test -s dist/arcade-theme.css
          test -s dist/account-client.js
          test ! -e dist/dashboard.html
          test ! -e dist/private
